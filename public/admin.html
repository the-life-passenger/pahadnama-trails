<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pahadnama Trails &bull; Admin Operations Console</title>
  <link rel="icon" type="image/png" href="/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="admin-login-screen">
    <div class="login-backdrop-glow"></div>
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo-wrapper">
          <img src="/brand/pahadnama-logo.png" alt="Pahadnama Trails Logo" class="login-logo">
        </div>
        <h2>PAHADNAMA <span class="badge-cms">PORTAL</span></h2>
        <p>Trail Operations &amp; Booking Management</p>
      </div>

      <!-- Live feedback error banner -->
      <div id="loginError" class="login-error-box hidden" role="alert"></div>

      <form id="loginForm" onsubmit="handleAdminLogin(event)" autocomplete="on">
        <div class="form-group">
          <label for="adminUser">Admin Username</label>
          <div class="input-icon-wrap">
            <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="adminUser" required placeholder="Enter username (e.g. the.life.passenger)" autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="adminPass">Password</label>
          <div class="password-wrapper">
            <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="adminPass" required placeholder="Enter admin password" autocomplete="current-password">
            <button type="button" class="btn-toggle-eye" id="toggleEyeBtn" onclick="togglePassVisibility()" aria-label="Toggle password visibility" title="Show/Hide password">
              <!-- Eye Open (visible) -->
              <svg id="eyeOpenIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <!-- Eye Slashed (hidden) -->
              <svg id="eyeSlashIcon" class="hidden" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-admin-primary w-full" id="loginSubmitBtn">
          <span>Sign In to Dashboard &rarr;</span>
        </button>

        <div class="login-security-notice">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Restricted Portal &bull; Sahyadri Operations</span>
        </div>
      </form>
    </div>
  </div>

  <!-- ADMIN APP WRAPPER -->
  <div id="adminApp" class="admin-app-layout hidden">
    
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <img src="/brand/pahadnama-logo.png" alt="Pahadnama Logo" class="admin-nav-logo">
        <div>
          <h3 class="admin-nav-title">PAHADNAMA</h3>
          <span class="admin-nav-sub">OPERATIONS CONSOLE</span>
        </div>
      </div>

      <nav class="admin-nav">
        <button class="nav-item active" data-tab="overview">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span> Overview
        </button>
        <button class="nav-item" data-tab="treks">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><path d="M23 21l-9-17-5 9.5"/></svg></span> Treks Manager
        </button>
        <button class="nav-item" data-tab="bookings">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></span> Bookings &amp; Payments <span class="badge-count" id="bookingsCountBadge" style="display:none">0</span>
        </button>
        <button class="nav-item" data-tab="dates">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span> Weekend Slots
        </button>
        <button class="nav-item" data-tab="photos">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span> Photo Gallery
        </button>
        <button class="nav-item" data-tab="feedback">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span> Reviews <span class="badge-count" id="pendingCountBadge">0</span>
        </button>
        <button class="nav-item" data-tab="faqs">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span> FAQs Manager
        </button>
        <button class="nav-item" data-tab="settings">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span> Booking Settings
        </button>
        <button class="nav-item" data-tab="security">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span> Security
        </button>
      </nav>

      <div class="sidebar-footer">
        <a href="/" target="_blank" class="sidebar-action-btn">
          <span>View Public Website &rarr;</span>
        </a>
        <button onclick="handleAdminLogout()" class="sidebar-logout-btn">
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="admin-main">
      <header class="admin-topbar">
        <div>
          <span class="topbar-subtitle">CONTROL PANEL</span>
          <h1 class="topbar-title" id="pageTitle">Dashboard Overview</h1>
        </div>
        <div class="topbar-actions" id="topbarActions">
          <button class="btn-admin-primary" onclick="openAddTrekModal()">
            + Add New Trek
          </button>
        </div>
      </header>

      <div class="admin-container" id="adminContent">
        <!-- Content dynamic injected via admin.js -->
      </div>
    </main>
  </div>

  <!-- ADMIN GENERIC MODAL -->
  <div class="admin-modal-overlay" id="adminModal" aria-hidden="true">
    <div class="admin-modal-dialog" id="adminModalDialog">
      <button class="admin-modal-close" onclick="closeAdminModal()">&times;</button>
      <div id="adminModalBody"></div>
    </div>
  </div>

  <div class="admin-toast" id="adminToast"></div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
